services:
  vyn-memory:
    image: python:3.12-slim
    container_name: vyn-memory
    restart: unless-stopped
    command: ["python3", "/app/server.py"]
    env_file:
      - .env
    environment:
      MEMORY_DATA_DIR: /data
      MEMORY_VAULT_DIR: /vault
      MEMORY_PORT: "8770"
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "127.0.0.1:${MEMORY_PORT:-8770}:8770"
    volumes:
      - ./server.py:/app/server.py:ro
      - ./data:/data
      - ./vault:/vault
      # Optional: uncomment to customize scopes, aliases, and sidebar groups
      # - ./settings.json:/app/settings.json:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8770/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
